<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>MyMovie - Movie Explorer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <h1>🎬 MyMovie</h1>

        <p>Your Personal Movie Planner</p>

        <nav>

            <a href="index.html">Movie Explorer</a>

            <a href="watchlist.html">My Watchlist</a>

        </nav>

    </header>


    <main>

        <section class="search-section">

            <h2>Movie Explorer</h2>

            <p>
                Search for a movie to view its information
                and receive a recommendation.
            </p>


            <input
                type="text"
                id="movieInput"
                placeholder="Enter movie title">


            <button id="searchBtn">
                Search Movie
            </button>


            <p id="message"></p>

        </section>


        <section>

            <div id="movieResult"></div>

        </section>

    </main>


    <script src="movies.js"></script>

</body>

</html>
